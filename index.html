<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم لاعبي أكاديمية مواهب الباحة</title>
    <!-- مكتبة تحويل PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --primary-blue: #1c4575; --light-blue: #f0f4f8; --white: #ffffff; --text-dark: #333333; --border-color: #d1d9e6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--light-blue); color: var(--text-dark); padding: 15px; }
        
        /* شاشة تسجيل الدخول */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--primary-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .login-box { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; text-align: center; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-box img { max-width: 120px; margin-bottom: 20px; border-radius: 10px; background: white; padding: 5px; }
        .login-input { padding: 12px; border-radius: 8px; border: none; text-align: center; font-size: 1.1rem; margin-bottom: 15px; width: 100%; max-width: 250px; outline: none; }
        .login-btn { padding: 12px 30px; background-color: white; color: var(--primary-blue); border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; max-width: 250px; transition: 0.3s; }
        .login-btn:active { transform: scale(0.95); }
        #errorMsg { color: #ff8a8a; margin-top: 15px; display: none; font-weight: bold; }

        /* تنسيقات صفحة التقييم */
        .container { background-color: var(--white); max-width: 600px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--primary-blue); }
        .logo { max-width: 120px; margin-bottom: 10px; }
        h1 { color: var(--primary-blue); font-size: 1.5rem; }
        h2 { font-size: 1.2rem; color: var(--primary-blue); margin-bottom: 15px; }
        .section-card { background-color: var(--light-blue); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: var(--text-dark); }
        input, select, textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-blue); box-shadow: 0 0 5px rgba(28, 69, 117, 0.3); }
        .evaluation-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 480px) { .evaluation-grid { grid-template-columns: 1fr 1fr; } }
        .action-buttons { max-width: 600px; margin: 20px auto; text-align: center; }
        .btn-primary { background-color: var(--primary-blue); color: var(--white); border: none; padding: 15px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; transition: 0.3s; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
        <div class="login-box">
            <img src="logo.jpeg" alt="شعار أكاديمية مواهب الباحة">
            <h2 style="margin-bottom: 10px;">أكاديمية مواهب الباحة</h2>
            <p style="margin-bottom: 20px;">النظام الخاص بالمدربين</p>
            <input type="password" id="passInput" class="login-input" placeholder="أدخل كلمة المرور">
            <br>
            <button onclick="checkPassword()" class="login-btn">تسجيل الدخول</button>
            <p id="errorMsg">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- محتوى التقييم -->
    <div id="evaluation-card" class="container">
        <header>
            <img src="logo.jpeg" alt="شعار أكاديمية مواهب الباحة" class="logo">
            <h1>تقييم الأداء الفني للاعبين</h1>
        </header>

        <form id="evaluationForm">
            <section class="section-card">
                <h2>المعلومات الأساسية</h2>
                <div class="input-group">
                    <label>اسم اللاعب:</label>
                    <input type="text" id="playerName" placeholder="أدخل اسم اللاعب" required>
                </div>
                <div class="input-group">
                    <label>العمر:</label>
                    <input type="number" id="playerAge" placeholder="أدخل عمر اللاعب" required>
                </div>
            </section>

            <section class="section-card">
                <h2>عناصر التقييم الفني</h2>
                <div class="evaluation-grid">
                    <!-- تم دمج خيارات التقييم لاختصار الكود -->
                    <script>
                        const skills = ['الاستلام', 'التسليم', 'الجري بالكرة', 'الوعي المكاني', 'الوعي بالملعب', 'السرعة', 'رفع الرأس'];
                        skills.forEach(skill => {
                            document.write(`
                                <div class="input-group">
                                    <label>${skill}:</label>
                                    <select required>
                                        <option value="">اختر التقييم...</option>
                                        <option value="متقن">متقن 🌟</option>
                                        <option value="متوسط">متوسط ⚡</option>
                                        <option value="يحتاج متابعة">يحتاج متابعة 📈</option>
                                    </select>
                                </div>
                            `);
                        });
                    </script>
                </div>
            </section>

            <section class="section-card">
                <h2>ملاحظات المدرب (اختياري)</h2>
                <div class="input-group">
                    <textarea id="coachNotes" rows="3" placeholder="أضف أي ملاحظات فنية..."></textarea>
                </div>
            </section>
        </form>
    </div>

    <div class="action-buttons">
        <button id="exportPdfBtn" class="btn-primary">تصدير (PDF) وإرسال للإيميل 📧</button>
    </div>

    <!-- كود الجافاسكربت المدمج -->
    <script>
        // التحقق من كلمة المرور
        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            if(pass === 'Ss-123456') {
                document.getElementById('loginScreen').style.display = 'none';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // تحويل PDF والمشاركة
        document.getElementById('exportPdfBtn').addEventListener('click', function() {
            const form = document.getElementById('evaluationForm');
            if (!form.checkValidity()) {
                alert("يرجى تعبئة اسم اللاعب، العمر، وجميع عناصر التقييم.");
                form.reportValidity();
                return;
            }

            const btn = document.getElementById('exportPdfBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "جاري الإنشاء... ⏳";
            btn.disabled = true;

            const element = document.getElementById('evaluation-card');
            const playerName = document.getElementById('playerName').value;
            const fileName = `تقييم_${playerName}.pdf`;

            const opt = {
                margin: 10,
                filename: fileName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).outputPdf('blob').then(function(pdfBlob) {
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({
                        title: 'تقييم الأداء',
                        text: `مرفق تقييم اللاعب ${playerName}. يرجى إرساله إلى: musicar555@gmail.com`,
                        files: [file]
                    }).finally(() => {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    });
                } else {
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.click();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
