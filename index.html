<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم لاعبي أكاديمية مواهب الباحة</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --primary-blue: #1c4575; --light-blue: #f0f4f8; --white: #ffffff; --text-dark: #333333; --border-color: #d1d9e6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--light-blue); color: var(--text-dark); padding: 15px; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--primary-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .login-box { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; text-align: center; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-box img { max-width: 120px; margin-bottom: 20px; border-radius: 10px; background: white; padding: 5px; }
        .login-input { padding: 12px; border-radius: 8px; border: none; text-align: center; font-size: 1.1rem; margin-bottom: 15px; width: 100%; max-width: 250px; outline: none; color: black; }
        .login-btn { padding: 12px 30px; background-color: white; color: var(--primary-blue); border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; max-width: 250px; transition: 0.3s; }
        #errorMsg { color: #ff8a8a; margin-top: 15px; display: none; font-weight: bold; }

        .container { background-color: var(--white); max-width: 800px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-blue); }
        .logo { max-width: 100px; margin-bottom: 10px; }
        h1 { color: var(--primary-blue); font-size: 1.4rem; }
        h2 { font-size: 1.1rem; color: var(--primary-blue); margin-bottom: 10px; }
        .section-card { background-color: var(--light-blue); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .input-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: var(--text-dark); font-size: 0.9rem; }
        input, select, textarea { padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; outline: none; background-color: white; appearance: none; }
        .evaluation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .action-buttons { max-width: 800px; margin: 20px auto; text-align: center; }
        .btn-primary { background-color: var(--primary-blue); color: var(--white); border: none; padding: 15px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; }

        .pdf-mode {
            width: 794px !important; 
            padding: 40px !important; 
            background-color: white !important;
            margin: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }
        .pdf-mode select { background-image: none !important; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <!-- استخدام المسار المحلي المباشر للصورة -->
            <img src="logo.jpeg" alt="شعار الأكاديمية">
            <h2 style="margin-bottom: 10px;">أكاديمية مواهب الباحة</h2>
            <p style="margin-bottom: 20px;">النظام الخاص بالمدربين</p>
            <input type="password" id="passInput" class="login-input" placeholder="أدخل كلمة المرور">
            <br>
            <button onclick="checkPassword()" class="login-btn">تسجيل الدخول</button>
            <p id="errorMsg">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="evaluation-card" class="container">
        <header>
            <!-- استخدام المسار المحلي المباشر للصورة -->
            <img src="logo.jpeg" alt="شعار الأكاديمية" class="logo">
            <h1>تقييم الأداء الفني للاعبين</h1>
        </header>

        <form id="evaluationForm">
            <section class="section-card">
                <h2>المعلومات الأساسية</h2>
                <div class="evaluation-grid">
                    <div class="input-group">
                        <label>اسم اللاعب:</label>
                        <input type="text" id="playerName" placeholder="أدخل اسم اللاعب" required>
                    </div>
                    <div class="input-group">
                        <label>العمر:</label>
                        <input type="number" id="playerAge" placeholder="أدخل عمر اللاعب" required>
                    </div>
                </div>
            </section>

            <section class="section-card">
                <h2>عناصر التقييم الفني</h2>
                <div class="evaluation-grid">
                    <script>
                        const skills = ['الاستلام', 'التسليم', 'الجري بالكرة', 'الوعي المكاني', 'الوعي بالملعب', 'السرعة', 'رفع الرأس'];
                        skills.forEach(skill => {
                            document.write(`
                                <div class="input-group">
                                    <label>${skill}:</label>
                                    <select required>
                                        <option value="">اختر...</option>
                                        <option value="متقن">متقن 🌟</option>
                                        <option value="متوسط">متوسط ⚡</option>
                                        <option value="يحتاج متابعة">يحتاج متابعة 📈</option>
                                    </select>
                                </div>
                            `);
                        });
                    </script>
                </div>
            </section>

            <section class="section-card">
                <h2>ملاحظات المدرب</h2>
                <div class="input-group">
                    <textarea id="coachNotes" rows="3" placeholder="أضف أي ملاحظات فنية..."></textarea>
                </div>
            </section>
        </form>
    </div>

    <div class="action-buttons">
        <button id="exportPdfBtn" class="btn-primary">تصدير (PDF) والمشاركة 📤</button>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            if(pass === 'Ss-123456') {
                document.getElementById('loginScreen').style.display = 'none';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        document.getElementById('exportPdfBtn').addEventListener('click', async function() {
            const form = document.getElementById('evaluationForm');
            if (!form.checkValidity()) {
                alert("يرجى تعبئة اسم اللاعب، العمر، وجميع عناصر التقييم.");
                form.reportValidity();
                return;
            }

            const btn = document.getElementById('exportPdfBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "جاري التصدير... ⏳";
            btn.disabled = true;

            const element = document.getElementById('evaluation-card');
            const playerName = document.getElementById('playerName').value;
            const fileName = `تقييم_${playerName}.pdf`;

            element.classList.add('pdf-mode');

            try {
                // التقاط الصورة والسماح بالصور المحلية
                const canvas = await html2canvas(element, {
                    scale: 2, 
                    useCORS: true,
                    allowTaint: true,
                    windowWidth: 800,
                    backgroundColor: '#ffffff'
                });

                element.classList.remove('pdf-mode');

                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                
                const pdfBlob = pdf.output('blob');
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file] });
                } else {
                    pdf.save(fileName);
                }

            } catch (error) {
                console.error("خطأ في التصدير: ", error);
                alert("حدث خطأ أثناء التصدير، حاول مرة أخرى.");
                element.classList.remove('pdf-mode');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
